version: 2

project_name: teams-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: teams-cli
    main: .
    binary: teams-cli
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - teams-cli
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - icons/teams-cli-logo.png

checksum:
  name_template: checksums.txt

changelog:
  use: git

release:
  github:
    owner: aeswibon
    name: teams-cli

homebrew_casks:
  - name: teams-cli
    ids:
      - default
    binaries:
      - teams-cli
    directory: Casks
    repository:
      owner: aeswibon
      name: homebrew-teams-cli
      branch: master
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }} {{ .Tag }}"
    homepage: "https://github.com/aeswibon/teams-cli"
    description: "CLI for Microsoft Teams chats and messages via Microsoft Graph API"
    license: "MIT"
    caveats: |
      Run `teams-cli init` to configure authentication before first use.
      See https://github.com/aeswibon/teams-cli for setup instructions.
    url:
      verified: "github.com/aeswibon/teams-cli/"
